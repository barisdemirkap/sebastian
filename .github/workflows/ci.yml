name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (Python 3.12)
        run: uv sync --extra dev --python 3.12
      - name: Tests (offline, no secrets)
        run: uv run pytest -q
