# Copy to ~/.config/sebastian/config.toml (outside the repo). Secrets/tokens live in ~/.config/sebastian/secrets/.
timezone = "Europe/Istanbul"
morning = "08:30"
evening = "20:00"
plan = "22:00"          # "tomorrow morning plan"
birthdays = true        # also read Google's Birthdays calendar (read-only)

[[accounts]]
provider = "google"
address = "you@gmail.com"
label = "personal"
scopes = ["https://www.googleapis.com/auth/calendar.readonly", "https://www.googleapis.com/auth/calendar.events"]  # events = preview-gated writes (ADR 0002)
enabled = false   # stays false until OAuth consent is given
mail_enabled = false   # Phase 2: separate owner approval; add the gmail.readonly scope above only then

[[accounts]]
provider = "outlook"
address = "you@company.com"
label = "company"
scopes = ["Calendars.Read"]
enabled = false
mail_enabled = false   # Phase 2: add "Mail.Read" to scopes only after owner approval

[reminders]
lead_minutes = 30        # default reminder lead for timed events
allday_at = "09:00"      # reminder time for all-day events

[oauth.google]
client_id = ""   # client secret, if any, goes in ~/.config/sebastian/secrets/google.client_secret

[oauth.outlook]
client_id = ""

[telegram]
enabled = false          # delivery goes to the owner's chat only, via your own bot
chat_id = ""
token_file = "telegram.token"   # inside ~/.config/sebastian/secrets/

[plugins]                # switch a feature off with false; everything is on by default (ADR 0005)
calendar = true          # events, birthdays, calendar commands and the calendar part of the digests
tasks = true             # to-dos, task commands, the digest task section and the hourly nag
lists = true             # named lists such as shopping
reminders = true         # event reminders (needs calendar)
digests = true           # the morning, evening and plan digests

[persona]
owner_title = "Ahmet Bey"     # how the assistant addresses you
assistant_name = "Sebastian"  # the name it uses for itself
language = "tr"               # reply language: "tr" (default) | "en"; see docs/LANGUAGES.md (what is and is not translated); English input is understood in every language

[channel]
kind = "telegram"          # telegram | slack | console
# slack_user = "U0123456"  # required for slack: your Slack member id (tokens live in the secrets dir)
