[project]
name = "sebastian"
version = "0.1.0"
description = "Personal assistant: read-only calendar digests"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sebastian"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[project.scripts]
sebastian = "sebastian.cli:main"
